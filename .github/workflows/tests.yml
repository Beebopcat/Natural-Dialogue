name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore NaturalDialogue.sln
      - run: dotnet build NaturalDialogue.sln --no-restore --configuration Release
      - run: dotnet test NaturalDialogue.sln --no-build --configuration Release --collect:"XPlat Code Coverage"
